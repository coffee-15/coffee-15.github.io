<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    {% seo %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Stack+Sans+Text:wght@200..700&display=swap"
      rel="stylesheet">
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_outward" />
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_forward" />
    <style>
      .material-symbols-rounded {
        font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 20
      }
      .js .reveal {
        opacity: 0;
        transform: translateY(28px);
        transition: opacity .6s ease, transform .6s ease;
      }
      .js .reveal.in { opacity: 1; transform: none; }
</style>

  </head>
  <body class="bg-background text-off-white antialiased scroll-smooth">
    {% include header.html %}
    <main class="w-full">
      <div class="w-full flex flex-col gap-y-48 py-32 md:py-48">
        {{ content }}
      </div>
    </main>
    {% include footer.html %}
  </body>

  <!-- Fade In -->
  <script>
  if ('IntersectionObserver' in window) {
    document.documentElement.classList.add('js');  // turn the hidden state on

    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (!entry.isIntersecting) return;   // skip blocks that are still off screen
        entry.target.classList.add('in');    // CSS runs the transition
        observer.unobserve(entry.target);    // once is enough
      });
    }, {
      root: document,                    // this page's own viewport, even inside a frame
      rootMargin: '0px 0px -10% 0px',    // start a little above the bottom edge
    });

    document.querySelectorAll('.reveal').forEach((el) => observer.observe(el));
  }
</script>

<script>
  document.querySelectorAll('.blur-wrap img').forEach(img => {
  if (img.complete) img.classList.add('loaded');
  else img.addEventListener('load', () => img.classList.add('loaded'));
});
</script>

</html>
